filebeat.inputs:
# ============================== Filebeat inputs(PFSense) ===============================

- type: udp
  max_message_size: 10MiB
  host: "0.0.0.0:5140"
  enabled: true

  fields:
     type: pfsense
  fields_under_root: true
  encoding: utf-8
  ignore_older: 12h
  tags: ["PFSense"]

# ============================== Filebeat Module(Fortinet) ===============================
filebeat.config:
  modules:
    # path: /usr/share/filebeat/modules.d/*.yml
    path: /etc/filebeat/modules.d/*.yml
    tags: ["fortinet"]
    reload.enabled: true

