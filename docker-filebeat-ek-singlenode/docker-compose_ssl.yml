version: "3.8"

services:
  setup:
    image: repo-nexus.kavosh.org/elasticsearch:${STACK_VERSION}
    volumes:
      - /data/elastic-ssl/certs:/usr/share/elasticsearch/config/certs
    user: "0"
    command: >
      bash -c '
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          echo -ne \
          "instances:\n"\
          "  - name: esnode1\n"\
          "    dns:\n"\
          "      - esnode1\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        echo "Setting file permissions"
        chown -R root:root config/certs;
        find . -type d -exec chmod 750 \{\} \;
        find . -type f -exec chmod 640 \{\} \;
        echo "Waiting for Elasticsearch availability";
        until curl -s --cacert config/certs/ca/ca.crt https://esnode1:9200 | grep -q "missing authentication credentials"; do sleep 30; done;
        echo "Setting kibana_system password";
        until curl -s -X POST --cacert config/certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" https://esnode1:9200/_security/user/kibana_system/_password -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 10; done;
        echo "Good to go!";
      '

  esnode1:
    depends_on:
      - setup
    image: repo-nexus.kavosh.org/elasticsearch:${STACK_VERSION}
    volumes:
      - /data/elastic-ssl/certs:/usr/share/elasticsearch/config/certs
      - /data/elastic-ssl/data_es01:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT}:9200"
      - 5150:5150 # PFsense
      - 5151:5151
      - 5152:5152
    environment:
      - node.name=esnode1
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/esnode1/esnode1.key
      - xpack.security.http.ssl.certificate=certs/esnode1/esnode1.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.http.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/esnode1/esnode1.key
      - xpack.security.transport.ssl.certificate=certs/esnode1/esnode1.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - elastic
  
  kibana:
    depends_on:
      - esnode1
    image: repo-nexus.kavosh.org/kibana:${STACK_VERSION}
    volumes:
      - /data/elastic-ssl/certs:/usr/share/kibana/config/certs
      - /data/kibana-ssl/data:/usr/share/kibana/data
    ports:
      - "${KIBANA_PORT}:5601"
      # - "8220:8220"
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=https://esnode1:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
    networks:
      - elastic


  elastic-agent:
    image: docker.elastic.co/beats/elastic-agent:${STACK_VERSION}
    container_name: elastic-agent
    restart: always
    user: root # note, synthetic browser monitors require this set to `elastic-agent`
    volumes:
      - /data/elastic-ssl/certs:/usr/share/kibana/config/certs
    environment:
      - FLEET_ENROLLMENT_TOKEN=AAEAAWVsYXN0aWMvZmxlZXQtc2VydmVyL3Rva2VuLTE3MDk5NzM2Mjk3NDk6MHJFc09LZkxSMGFGMVJkeVBFWDdSQQ
      - FLEET_ENROLL=1
      - FLEET_URL=https://elastic-agent:8220
      - FLEET_SERVER_ENABLE=true
      - FLEET_SERVER_ELASTICSEARCH_HOST=http://filebeat-esnode1-1:9200
      - FLEET_SERVER_SERVICE_TOKEN=AAEAAWVsYXN0aWMvZmxlZXQtc2VydmVyL3Rva2VuLTE3MDk5ODMwNjg1NDc6YXV3X3A1TVdSTFdNV2l5a3BvMEs0Zw
      # - FLEET_SERVER_POLICY_NAME=1f6f5f25-e2a3-4263-baea-37cee6ad5a0d
      - FLEET_SERVER_POLICY_ID=1f6f5f25-e2a3-4263-baea-37cee6ad5a0d
      - certificate-authorities
      - FLEET_CA=/usr/share/kibana/config/certs/esnode1/esnode1.pem
      - FLEET_SERVER_ELASTICSEARCH_CA=/usr/share/kibana/config/certs/esnode1/esnode1.pem
      - FLEET_SERVER_CERT=/usr/share/kibana/config/certs/ca/ca.crt
      - FLEET_SERVER_CERT_KEY=/usr/share/kibana/config/certs/ca/ca.key
      - FLEET_SERVER_PORT=8220
      # - FLEET_SERVER_CERT_KEY_PASSPHRASE
      # - FLEET_SERVER_INSECURE_HTTP
    networks:
      - elastic


  filebeat:
    build:
      # context: filebeat
      # dockerfile: .
      dockerfile: Dockerfile
    # image: repo-nexus.kavosh.org/elastic/filebeat:8.12.0
    container_name: filebeat
    user: root
    volumes:
      - /etc/localtime:/etc/localtime:ro
# DOCKER
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
# FileBeat Config
      - /data/filebeat/data:/usr/share/filebeat/data
      # - /data/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /data/filebeat/ingest_data/:/usr/share/filebeat/ingest_data/
# Modules
      # - /data/filebeat/modules.d:/usr/share/filebeat/modules.d:ro     # FortiNet
      # - /data/filebeat/modules.d/fortinet.yml:/usr/share/filebeat/modules.d/fortinet.yml:ro     # FortiNet
# Static Files
      - /srv/docker-composes/nginx/logs/nginx:/var/log/nginx:ro   # NGINX
# Certs
      # - certs:/usr/share/filebeat/certs

    ports:
      - 514:514
      - 514:514/udp
      - 5140:5140/udp #PFSense
      - 5141:5141/udp
      - 5142:5142/udp
      - 9004:9004/udp #Fortinet
    environment:
      - ELASTIC_USER=${ELASTIC_USER}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTIC_HOSTS=http://es01:9200
      - KIBANA_HOSTS=http://kibana:5601
      # - LOGSTASH_HOSTS=http://logstash01:9600
    # healthcheck:
    #    test: curl -s http://filebeat >/dev/null || exit 1
    #    interval: 30s
    #    timeout: 10s
    #    retries: 50
    networks:
      - elastic
    # command: /bin/bash -c "filebeat modules enable fortinet && filebeat setup && service filebeat start"


networks:
  elastic:
    external: true
    name: elastic


